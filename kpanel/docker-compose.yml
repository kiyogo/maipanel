services:
  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: kpanel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     kpanel
      POSTGRES_PASSWORD: kpanel123
      POSTGRES_DB:       kpanel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpanel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: kpanel_redis
    restart: unless-stopped
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data

  # ===== Backend (Rust + Axum + Tokio + SQLx) =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kpanel_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://kpanel:kpanel123@postgres:5432/kpanel
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USERNAME: kpanel
      DB_PASSWORD: kpanel123
      DB_NAME:     kpanel
      JWT_SECRET:  kpanel-super-secret-jwt-key-2026
      JWT_EXPIRES_IN: 7d
      PORT:        3001
      RUST_LOG:    kpanel_backend=info,tower_http=info
    ports:
      - "3001:3001"

  # ===== Frontend (Vite build) =====
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: kpanel_frontend
    restart: unless-stopped
    ports:
      - "3006:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
